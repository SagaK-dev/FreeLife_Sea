# FreeLifeMarineMobs 1.12.5
# Show settings can be edited here or from Minecraft with /marine show ... commands.
# A show only uses orcas that were already spawned with /marine spawn orca.
# It never creates marine mobs automatically.

shows:
  orca-show:
    enabled: false
    time-zone: 'Asia/Tokyo'
    times:
      - '10:00'
      - '13:00'
      - '15:30'

    world: 'world'
    center:
      x: 0.5
      y: 63.0
      z: 0.5

    # 0 = south (+Z), 90 = west (-X), 180 = north (-Z), -90 = east (+X).
    heading-yaw: 0.0

    orcas: 4
    control-radius: 48.0
    audience-radius: 64.0

    music:
      enabled: true
      volume: 0.75
