name: FreeLifeMarineMobs
version: 1.12.2
main: com.sagakenichi.freelifemarine.FreeLifeMarineMobsPlugin
api-version: '1.21'
author: Naokibot
description: Animated marine mobs with tropical-fish-style autonomous swimming, robust spawn diagnostics, isolated airborne breach handling, mounted orca tuning, falling-block gravity, water-surface stabilization, red damage flashes, rider-driven breaches, and scheduled orca shows.
commands:
  marine:
    aliases: [freelifesea, flsea]
    description: Manage FreeLife marine mobs, calls, mounted tuning, marine food, and orca shows.
    usage: /marine <spawn|call|speed|jump|food|show>
permissions:
  freelifemarine.spawn:
    description: Allows spawning shark, orca, and crab mobs, including from command blocks.
    default: op
  freelifemarine.call:
    description: Allows calling the nearest spawned orca to the player.
    default: op
  freelifemarine.tune:
    description: Allows changing an orca's settings while driving it.
    default: op
  freelifemarine.food:
    description: Allows receiving the custom marine food item.
    default: op
  freelifemarine.show:
    description: Allows configuring and controlling orca shows.
    default: op
