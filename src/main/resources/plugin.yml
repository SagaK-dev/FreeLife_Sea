name: FreeLifeMarineMobs
version: 1.12.7
main: com.sagakenichi.freelifemarine.FreeLifeMarineMobsPlugin
api-version: '1.21'
author: Naokibot
softdepend: [Geyser-Spigot, floodgate]
description: Animated marine mobs with faster server-committed autonomous swimming, Bedrock fallback rendering for Geyser/Floodgate, cross-client ridden orca input compatibility, robust spawn diagnostics, isolated airborne breach handling, mounted orca tuning, falling-block gravity, water-surface stabilization, red damage flashes, rider-driven breaches, and scheduled orca shows.
commands:
  marine:
    aliases: [flsea]
    description: Manage FreeLife marine mobs, calls, mounted tuning, marine food, and orca shows.
  freelifesea:
    description: Dedicated FreeLife Sea command that bypasses /marine name collisions.
permissions:
  freelifemarine.spawn:
    description: Allows spawning shark, orca, and crab mobs, including from command blocks.
    default: op
  freelifemarine.call:
    description: Allows calling the nearest spawned orca to the player.
    default: op
  freelifemarine.tune:
    description: Allows changing an orca's settings while driving it.
    default: op
  freelifemarine.food:
    description: Allows receiving the custom marine food item.
    default: op
  freelifemarine.show:
    description: Allows configuring and controlling orca shows.
    default: op
