name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and build
        run: mvn -B -U verify
      - name: Verify release jar
        run: |
          JAR=$(find target -maxdepth 1 -type f -name 'FreeLifeMarineMobs-*-Spigot-1.21.1.jar' | head -n 1)
          test -n "$JAR"
          echo "Verifying $JAR"
          unzip -t "$JAR"
          jar tf "$JAR" | grep -q '^plugin.yml$'
          jar tf "$JAR" | grep -q '^config.yml$'
          jar tf "$JAR" | grep -q 'MarineMobService.class$'
          jar tf "$JAR" | grep -q 'MarineWaterPhysics.class$'
          jar tf "$JAR" | grep -q 'MarinePursuitProfile.class$'
          jar tf "$JAR" | grep -q 'MarineActivityProfile.class$'
          jar tf "$JAR" | grep -q 'MarineJumpProfile.class$'
          jar tf "$JAR" | grep -q 'MarineGravityPolicy.class$'
          jar tf "$JAR" | grep -q 'MarineMotionTuning.class$'
          jar tf "$JAR" | grep -q 'MarineAirKinematics.class$'
          jar tf "$JAR" | grep -q 'MarineFinalMotionController.class$'
          jar tf "$JAR" | grep -q 'MarineSpeedLevel.class$'
          jar tf "$JAR" | grep -q 'MarineHitboxProfile.class$'
          jar tf "$JAR" | grep -q 'MarineFood.class$'
          jar tf "$JAR" | grep -q 'OrcaShowManager.class$'
          javap -verbose -classpath "$JAR" com.sagakenichi.freelifemarine.FreeLifeMarineMobsPlugin | grep 'major version: 65'
          if jar tf "$JAR" | grep -Eq '^org/bukkit/'; then
            echo 'Bukkit classes must not be shaded into the plugin.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FreeLifeMarineMobs-Spigot-1.21.1
          path: target/FreeLifeMarineMobs-*-Spigot-1.21.1.jar
          if-no-files-found: error
